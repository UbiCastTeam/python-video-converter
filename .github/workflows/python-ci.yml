# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.11, 3.13]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip setuptools
        pip install --no-cache-dir -e '.[dev]'
    - name: Lint code with Python ${{ matrix.python-version }}
      run: |
        flake8 .
    - name: Check for deadcode with Python ${{ matrix.python-version }}
      run: |
        vulture --min-confidence 90 converter
    - name: Run test with Python ${{ matrix.python-version }}
      run: |
        pytest --cov -- test/test.py
